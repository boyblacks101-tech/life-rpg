<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>English World</title>

    <link rel="stylesheet" href="english.css">
</head>

<body>

<div class="world">

    <header>
        <a href="../index.html">←</a>

        <div>
            <small>WORLD 01</small>
            <h1>English World</h1>
        </div>
    </header>


    <section class="world-status">

        <div>
            <small>LEVEL</small>
            <strong id="englishLevel">1</strong>
        </div>

        <div class="world-xp">
            <small>XP</small>

            <div class="xp-bar">
                <div id="englishXPBar"></div>
            </div>

            <span id="englishXP">0 / 100 XP</span>
        </div>

    </section>


    <section class="learning">

        <small class="title">LEARNING</small>

        <a href="#" class="learning-card">
            <div class="icon">✦</div>

            <div>
                <strong>Flashcards</strong>
                <span>Words · Idioms · Vocabulary</span>
            </div>

            <b>→</b>
        </a>


        <a href="#" class="learning-card">
            <div class="icon">A</div>

            <div>
                <strong>Grammar</strong>
                <span>Grammar training</span>
            </div>

            <b>→</b>
        </a>


        <a href="#" class="learning-card">
            <div class="icon">◉</div>

            <div>
                <strong>Progress</strong>
                <span>Your English statistics</span>
            </div>

            <b>→</b>
        </a>

    </section>


    <section class="stats">

        <small class="title">TODAY</small>

        <div class="stats-row">

            <div>
                <strong>0</strong>
                <span>cards</span>
            </div>

            <div>
                <strong>0</strong>
                <span>words</span>
            </div>

            <div>
                <strong>0</strong>
                <span>streak</span>
            </div>

        </div>

    </section>

</div>

<script src="english.js"></script>

</body>
</html>
