<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Life RPG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <span class="brand">LIFE RPG</span>
            <p>Build yourself.</p>
        </div>
        <button class="icon-btn">⚙</button>
    </header>

    <section class="hero">

        <div class="hero-top">
            <div>
                <span class="label">CURRENT LEVEL</span>
                <h1>Level <strong id="level">1</strong></h1>
            </div>

            <div class="xp-value">
                <strong id="xp">0</strong>
                <span>/ 100 XP</span>
            </div>
        </div>

        <div class="xp-track">
            <div id="xpBar"></div>
        </div>

        <p class="next-level">100 XP until next level</p>

    </section>

    <section class="section">

        <div class="section-title">
            <h2>Today</h2>
            <span>Thursday</span>
        </div>

        <div class="stats-grid">

            <div class="mini-card">
                <span>QUESTS</span>
                <strong>0</strong>
                <small>completed</small>
            </div>

            <div class="mini-card">
                <span>STREAK</span>
                <strong>0</strong>
                <small>days</small>
            </div>

            <div class="mini-card">
                <span>STUDY</span>
                <strong>0h</strong>
                <small>today</small>
            </div>

        </div>

    </section>

    <section class="section">

        <div class="section-title">
            <h2>Quick Access</h2>
        </div>

        <a href="flashcards/flashcards.html"
           class="feature">

            <div class="feature-icon">✦</div>

            <div class="feature-info">
                <strong>Flashcards</strong>
                <span>
                    Words · Native Patterns · Tech
                </span>
            </div>

            <div class="arrow">›</div>

        </a>

        <button class="feature">

            <div class="feature-icon">⚔</div>

            <div class="feature-info">
                <strong>Daily Quests</strong>
                <span>Complete actions and earn XP</span>
            </div>

            <div class="arrow">›</div>

        </button>

        <button class="feature">

            <div class="feature-icon">◈</div>

            <div class="feature-info">
                <strong>Character</strong>
                <span>Stats, skills and progression</span>
            </div>

            <div class="arrow">›</div>

        </button>

    </section>

    <nav class="bottom-nav">

        <a class="active" href="index.html">
            <span>⌂</span>
            Home
        </a>

        <a href="flashcards/flashcards.html">
            <span>✦</span>
            Learn
        </a>

        <a href="#">
            <span>⚔</span>
            Quests
        </a>

        <a href="#">
            <span>◉</span>
            Character
        </a>

    </nav>

</div>

<script src="script.js"></script>

</body>
</html>
