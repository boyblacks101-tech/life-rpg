<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Life RPG</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<div id="photoBg"></div>
<div id="photoOverlay"></div>

<div class="app">

<header>

    <div>

        <small>
            LIFE RPG
        </small>

        <h1>
            Good morning,<br>
            Player.
        </h1>

    </div>

    <!-- DASHBOARD BUTTON -->

    <button
        id="dashboardButton"
        class="ios-icon-button"
        aria-label="Open dashboard"
    >
        ◉
    </button>

</header>


<!-- DASHBOARD -->

<div
    id="dashboardMenu"
    class="dashboard-menu"
>

    <div class="dashboard-header">

        <div>
            <small>
                PLAYER MENU
            </small>

            <strong>
                Dashboard
            </strong>
        </div>

        <button
            id="closeDashboard"
            class="ios-icon-button"
        >
            ×
        </button>

    </div>


    <div class="dashboard-grid">

        <!-- NCR -->

        <a
            href="flashcards/chat/chat.html"
            class="dashboard-item"
        >

            <span class="dashboard-icon ncr-icon">
                ◉
            </span>

            <span>
                NCR
            </span>

        </a>


        <!-- ENGLISH -->

        <a
            href="english/english.html"
            class="dashboard-item"
        >

            <span class="dashboard-icon english-icon">
                文
            </span>

            <span>
                English
            </span>

        </a>


        <!-- CYBER -->

        <a
            href="cyber/cyber.html"
            class="dashboard-item"
        >

            <span class="dashboard-icon cyber-icon">
                &lt;/&gt;
            </span>

            <span>
                Cyber
            </span>

        </a>


        <!-- SETTINGS -->

        <button
            id="settings"
            class="dashboard-item"
        >

            <span class="dashboard-icon settings-icon">
                ⚙
            </span>

            <span>
                Settings
            </span>

        </button>

    </div>

</div>


<!-- PHOTO CONTROLS -->

<section class="photo-controls">

    <input
        id="photoInput"
        type="file"
        accept="image/*"
        multiple
    >

    <div id="photoTabs"></div>

</section>


<main>


<!-- CHARACTER -->

<section class="character">

    <div class="avatar">

        <span>
            01
        </span>

    </div>


    <div class="level">

        <small>
            LEVEL
        </small>

        <strong id="level">
            1
        </strong>

        <div class="xp">

            <div id="xpBar"></div>

        </div>

        <span id="xpText">
            0 / 100 XP
        </span>

    </div>

</section>


<!-- NEXT LEVEL -->

<section class="next-level">

    <small>
        NEXT LEVEL
    </small>

    <strong id="nextXP">
        100 XP
    </strong>

    <p>
        Keep going to upgrade your character.
    </p>

</section>


<!-- TODAY -->

<section class="today">

    <div class="section-head">

        <span>
            TODAY
        </span>

        <small>
            THU · AUG 13
        </small>

    </div>


    <div class="today-row">

        <div>

            <strong>
                0
            </strong>

            <span>
                quests
            </span>

        </div>


        <div>

            <strong>
                0
            </strong>

            <span>
                cards
            </span>

        </div>


        <div>

            <strong>
                0
            </strong>

            <span>
                streak
            </span>

        </div>

    </div>

</section>


<!-- CONTINUE -->

<section class="continue">

    <small>
        CONTINUE
    </small>


    <a
        href="flashcards/flashcards.html"
    >

        <div class="learn-icon">
            ✦
        </div>


        <div>

            <strong>
                Flashcards
            </strong>

            <span>
                Train your knowledge
            </span>

        </div>


        <b>
            →
        </b>

    </a>

</section>


</main>


<!-- BOTTOM NAV -->

<nav>

    <a
        class="active"
        href="index.html"
    >

        <span>
            ⌂
        </span>

        Home

    </a>


    <a
        href="flashcards/flashcards.html"
    >

        <span>
            ✦
        </span>

        Learn

    </a>


    <a
        href="flashcards/chat/chat.html"
    >

        <span>
            ◉
        </span>

        NCR

    </a>


    <a href="#">

        <span>
            ⚔
        </span>

        Quests

    </a>

</nav>


</div>


<script src="script.js"></script>

</body>

</html>
