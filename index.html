<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Life RPG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <div>
            <small>LIFE RPG</small>
            <h1>Good morning,<br>Player.</h1>
        </div>
        <button>⚙</button>
    </header>

    <main>

        <section class="character">
            <div class="avatar">
                <span>01</span>
            </div>

            <div class="level">
                <small>LEVEL</small>
                <strong id="level">1</strong>

                <div class="xp">
                    <div id="xpBar"></div>
                </div>

                <span id="xpText">0 / 100 XP</span>
            </div>
        </section>

        <section class="today">

            <div class="section-head">
                <span>TODAY</span>
                <small>THU · AUG 13</small>
            </div>

            <div class="today-row">
                <div>
                    <strong>0</strong>
                    <span>quests</span>
                </div>

                <div>
                    <strong>0</strong>
                    <span>cards</span>
                </div>

                <div>
                    <strong>0</strong>
                    <span>streak</span>
                </div>
            </div>

        </section>

        <section class="continue">

            <small>CONTINUE</small>

            <a href="flashcards/flashcards.html">

                <div class="learn-icon">✦</div>

                <div>
                    <strong>Flashcards</strong>
                    <span>Train your knowledge</span>
                </div>

                <b>→</b>

            </a>

        </section>

        <section class="activity">

            <div class="section-head">
                <span>RECENT ACTIVITY</span>
                <small>VIEW ALL</small>
            </div>

            <p>No activity yet.</p>

        </section>

    </main>

    <nav>
        <a class="active" href="index.html">
            <span>⌂</span>Home
        </a>

        <a href="flashcards/flashcards.html">
            <span>✦</span>Learn
        </a>

        <a href="#">
            <span>⚔</span>Quests
        </a>

        <a href="#">
            <span>◉</span>Character
        </a>
    </nav>

</div>

<script src="script.js"></script>
</body>
</html>
