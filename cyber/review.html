<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Cyber Review</title>

<link
    rel="stylesheet"
    href="review.css"
>

</head>

<body>

<div class="review-app">

<header class="review-header">

<a href="../cyber.html" class="back">
    ←
</a>

<div>
    <small>CYBER SLEUTH</small>
    <h1>Review</h1>
</div>

</header>


<main>

<section class="review-card">

<div class="terminal-top">

<div class="terminal-dots">

<span class="red"></span>
<span class="yellow"></span>
<span class="green"></span>

</div>

<span class="terminal-name">
bash
</span>

</div>


<div class="terminal-body">

<p class="command">
<span>$</span> review --start
</p>

<p>
Loading your Cyber Security review...
</p>

<p>
Checking completed lessons...
</p>

<p>
Checking flashcards...
</p>

<p class="success">
✓ Review session ready
</p>

<p class="command">
<span>$</span> _
</p>

</div>

</section>


<section class="review-info">

<small>
TODAY'S REVIEW
</small>

<div class="review-stats">

<div>
<strong id="reviewCards">0</strong>
<span>cards</span>
</div>

<div>
<strong id="reviewXP">0</strong>
<span>XP</span>
</div>

<div>
<strong id="reviewStreak">0</strong>
<span>streak</span>
</div>

</div>

</section>


<button
    id="startReview"
    class="start-button"
>
START REVIEW
<span>→</span>
</button>

</main>

</div>


<script src="review.js"></script>

</body>

</html>
