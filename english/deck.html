<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Deck</title>

    <link
        rel="stylesheet"
        href="english.css"
    >
</head>

<body>

<div class="english-app">

    <header class="english-header">

        <div>
            <small>ENGLISH WORLD</small>

            <h1 id="deckTitle">Deck</h1>

            <p id="deckDescription">
                Vocabulary collection
            </p>
        </div>

        <a
            href="english.html"
            class="back-button"
        >
            ←
        </a>

    </header>


    <section class="deck-stats">

        <div>
            <strong id="cardCount">0</strong>
            <small>CARDS</small>
        </div>

        <div>
            <strong id="masteredCount">0</strong>
            <small>MASTERED</small>
        </div>

    </section>


    <section class="add-card-section">

        <div class="section-title">

            <div>
                <small>VOCABULARY</small>
                <h2>Add Card</h2>
            </div>

        </div>


        <form id="cardForm">

            <input
                id="wordInput"
                type="text"
                placeholder="English word"
                required
            >

            <input
                id="meaningInput"
                type="text"
                placeholder="Meaning"
                required
            >

            <input
                id="exampleInput"
                type="text"
                placeholder="Example sentence"
            >

            <button
                type="submit"
                class="create-button"
            >
                + Add Card
            </button>

        </form>

    </section>


    <section class="cards-section">

        <div
            id="cardList"
            class="card-list"
        ></div>

        <div
            id="emptyCards"
            class="empty-deck"
        >

            <div class="empty-icon">
                +
            </div>

            <strong>
                No cards yet
            </strong>

            <p>
                Add your first English word.
            </p>

        </div>

    </section>


    <button
        id="startReview"
        class="review-main-button"
    >
        Start Review →
    </button>

</div>


<script src="deck.js"></script>

</body>

</html>
