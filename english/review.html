<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Review</title>

    <link
        rel="stylesheet"
        href="english.css"
    >
</head>

<body>

<div class="english-app review-app">

    <header class="english-header">

        <div>
            <small>ENGLISH WORLD · REVIEW</small>

            <h1 id="reviewDeckName">
                Review
            </h1>

            <p id="reviewProgress">
                1 / 1
            </p>
        </div>

        <a
            href="english.html"
            class="back-button"
        >
            ×
        </a>

    </header>


    <main class="review-main">

        <div class="review-card">

            <small id="cardNumber">
                CARD 01
            </small>

            <h2 id="word">
                Word
            </h2>

            <div
                id="answer"
                class="review-answer"
            >
                <span>
                    Think of the meaning...
                </span>
            </div>

            <button
                id="showAnswer"
                class="show-answer"
            >
                Show Answer
            </button>

        </div>


        <div
            id="ratingButtons"
            class="rating-buttons"
        >

            <button data-rating="again">
                Again
            </button>

            <button data-rating="hard">
                Hard
            </button>

            <button data-rating="good">
                Good
            </button>

            <button data-rating="easy">
                Easy
            </button>

        </div>

    </main>

</div>

<script src="review.js"></script>

</body>
</html>
