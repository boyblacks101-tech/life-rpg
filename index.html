<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Life RPG</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0b0b12;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app {
            width: min(900px, 92%);
            padding: 30px;
            border: 1px solid #252536;
            border-radius: 20px;
            background: #12121c;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #9999aa;
        }
    </style>
</head>

<body>

    <main class="app">
        <h1>Life RPG</h1>
        <p>Your real life. Your character. Your progression.</p>
    </main>

</body>
</html>
