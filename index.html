<script src="script.js"></script>


<script>

window.addEventListener(
  "load",
  function () {

    const loading =
      document.getElementById(
        "loading-container"
      );

    if (!loading) {
      return;
    }

    setTimeout(
      function () {

        loading.classList.add(
          "loading-hidden"
        );

        setTimeout(
          function () {

            loading.remove();

          },
          500
        );

      },
      700
    );

  }
);

</script>
