<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cyber Sleuth World</title>

    <link rel="stylesheet" href="cyber.css">
</head>

<body>

<div class="cyber-world">

    <header>

        <a href="../index.html">←</a>

        <div>
            <small>WORLD 02</small>
            <h1>Cyber Sleuth World</h1>
        </div>

    </header>


    <section class="cyber-status">

        <div>
            <small>LEVEL</small>
            <strong id="cyberLevel">1</strong>
        </div>

        <div class="cyber-xp">

            <small>XP</small>

            <div class="xp-bar">
                <div id="cyberXPBar"></div>
            </div>

            <span id="cyberXP">0 / 100 XP</span>

        </div>

    </section>


    <section class="cyber-learning">

        <small class="title">CYBER TRAINING</small>


        <a href="#" class="cyber-card">

            <div class="cyber-icon">
                &lt;/&gt;
            </div>

            <div>
                <strong>Cyber Flashcards</strong>
                <span>Web · Networking · Security</span>
            </div>

            <b>→</b>

        </a>


        <a href="#" class="cyber-card">

            <div class="cyber-icon">
                ▣
            </div>

            <div>
                <strong>Notes</strong>
                <span>Cybersecurity knowledge base</span>
            </div>

            <b>→</b>

        </a>


        <a href="#" class="cyber-card">

            <div class="cyber-icon">
                $
            </div>

            <div>
                <strong>Bug Bounty</strong>
                <span>Hunting · Labs · Reports</span>
            </div>

            <b>→</b>

        </a>


        <a href="#" class="cyber-card">

            <div class="cyber-icon">
                01
            </div>

            <div>
                <strong>IT Progress</strong>
                <span>Linux · Network · Programming</span>
            </div>

            <b>→</b>

        </a>

    </section>


    <section class="cyber-stats">

        <small class="title">TODAY</small>

        <div class="stats-row">

            <div>
                <strong>0</strong>
                <span>cards</span>
            </div>

            <div>
                <strong>0</strong>
                <span>notes</span>
            </div>

            <div>
                <strong>0</strong>
                <span>labs</span>
            </div>

        </div>

    </section>

</div>

<script src="cyber.js"></script>

</body>
</html>
