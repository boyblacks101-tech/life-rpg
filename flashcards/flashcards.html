<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Flashcards</title>
<link rel="stylesheet" href="flashcards.css">
</head>

<body>

<div class="app">

<header class="top">
<a href="../index.html">←</a>

<div>
<small>LEARNING</small>
<h1>Flashcards</h1>
</div>

<button id="more">⋮</button>
</header>

<section class="player-card">

<div class="player">
<div class="avatar">01</div>

<div>
<small>PLAYER</small>
<strong>Level <span id="level">1</span></strong>
</div>
</div>

<div class="xp-info">
<span id="xpText">0 / 100 XP</span>
<div class="xp">
<div id="xpBar"></div>
</div>
</div>

</section>

<section class="stats">

<div>
<strong id="newCount">24</strong>
<span>New</span>
</div>

<div>
<strong id="learningCount">18</strong>
<span>Learning</span>
</div>

<div>
<strong id="reviewCount">42</strong>
<span>Review</span>
</div>

</section>

<section class="collections">

<div class="section-title">
<h2>Collections</h2>
</div>

<div id="deckList"></div>

<button id="newDeck" class="empty-card">

 <a class="add-card-link" href="editor.html">
    <span>+</span>
    Add new flashcard
 </a>
  
<div class="empty-icon">+</div>

<strong>Create a collection</strong>

<span>
Group your flashcards by subject
</span>

</button>

</section>

<nav>
<a href="../index.html">⌂<small>Home</small></a>
<a class="active" href="#">✦<small>Learn</small></a>
<a href="#">⚔<small>Quests</small></a>
<a href="#">◉<small>Character</small></a>
</nav>

</div>

<script src="flashcards.js"></script>
</body>
</html>
