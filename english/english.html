<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>English World · Troviruses</title>

    <link
        rel="stylesheet"
        href="english.css"
    >

</head>

<body>

<div class="english-app">


    <!-- ================= HEADER ================= -->

    <header class="english-header">

        <div>

            <small>
                WORLD 01
            </small>

            <h1>
                English World
            </h1>

        </div>

        <a
            href="../index.html"
            class="back-button"
        >
            ←
        </a>

    </header>


    <!-- ================= PLAYER ================= -->

    <section class="english-player">

        <div class="player-main">

            <small>
                ENGLISH LEVEL
            </small>

            <strong id="englishLevel">
                1
            </strong>

            <div class="english-xp">

                <div id="englishXPBar"></div>

            </div>

            <span id="englishXPText">
                0 / 100 XP
            </span>

        </div>


        <div class="english-stats">

            <div>
                <strong id="wordsLearned">
                    0
                </strong>

                <span>
                    words
                </span>
            </div>

            <div>
                <strong id="englishStreak">
                    0
                </strong>

                <span>
                    streak
                </span>
            </div>

            <div>
                <strong id="cardsDue">
                    0
                </strong>

                <span>
                    due
                </span>
            </div>

        </div>

    </section>


    <!-- ================= QUICK ACTIONS ================= -->

    <section class="english-actions">

        <button
            class="english-action primary"
            id="reviewButton"
        >

            <span>
                ↻
            </span>

            <div>

                <strong>
                    Review
                </strong>

                <small>
                    Study cards due today
                </small>

            </div>

            <b>
                →
            </b>

        </button>


        <button
            class="english-action"
            id="vocabularyButton"
        >

            <span>
                Aa
            </span>

            <div>

                <strong>
                    Vocabulary
                </strong>

                <small>
                    Browse your words
                </small>

            </div>

            <b>
                →
            </b>

        </button>

    </section>


    <!-- ================= DECKS ================= -->

    <section class="decks-section">

        <div class="section-head">

            <div>

                <small>
                    COLLECTIONS
                </small>

                <h2>
                    My Decks
                </h2>

            </div>

            <button
                id="createDeckButton"
                class="create-button"
            >
                + Deck
            </button>

        </div>


        <div
            id="deckList"
            class="deck-list"
        >

            <!-- Decks will be inserted by JavaScript -->

        </div>

    </section>


    <!-- ================= SPECIAL ================= -->

    <section class="special-section">

        <div class="section-head">

            <div>

                <small>
                    SPECIAL
                </small>

                <h2>
                    More
                </h2>

            </div>

        </div>


        <button
            class="english-action"
            id="pakdastButton"
        >

            <span>
                ✦
            </span>

            <div>

                <strong>
                    پاکدست
                </strong>

                <small>
                    English practice & challenges
                </small>

            </div>

            <b>
                →
            </b>

        </button>

    </section>


    <!-- ================= BOTTOM NAV ================= -->

    <nav class="english-nav">

        <a
            class="active"
            href="english.html"
        >

            <span>
                ⌂
            </span>

            Home

        </a>


        <a href="#decks">

            <span>
                ▣
            </span>

            Decks

        </a>


        <a href="#review">

            <span>
                ↻
            </span>

            Review

        </a>


        <a href="#vocabulary">

            <span>
                Aa
            </span>

            Words

        </a>

    </nav>


</div>



<!-- ================= CREATE DECK MODAL ================= -->

<div
    id="deckModal"
    class="modal-overlay"
>

    <div class="deck-modal">

        <div class="modal-header">

            <div>

                <small>
                    NEW COLLECTION
                </small>

                <h2>
                    Create Deck
                </h2>

            </div>


            <button
                id="closeDeckModal"
                class="close-modal"
            >
                ×
            </button>

        </div>


        <form id="deckForm">

            <div class="modal-field">

                <label>
                    Deck name
                </label>

                <input
                    id="deckName"
                    type="text"
                    placeholder="e.g. Daily Vocabulary"
                    required
                >

            </div>


            <div class="modal-field">

                <label>
                    Description
                </label>

                <input
                    id="deckDescription"
                    type="text"
                    placeholder="What are you learning?"
                >

            </div>


            <button
                type="submit"
                class="create-deck-submit"
            >
                CREATE DECK
            </button>

        </form>

    </div>

</div>


<script src="english.js"></script>

</body>

</html>
