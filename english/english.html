<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>English World</title>

    <link
        rel="stylesheet"
        href="english.css"
    >
</head>

<body>

<div class="english-app">

    <!-- HEADER -->

    <header class="english-header">

        <div>
            <small>WORLD 01</small>

            <h1>English World</h1>

            <p>Build your English.</p>
        </div>

        <a
            href="../index.html"
            class="back-button"
        >
            ←
        </a>

    </header>


    <!-- XP -->

    <section class="english-progress">

        <div class="progress-top">

            <span>ENGLISH XP</span>

            <strong id="englishXP">
                0 XP
            </strong>

        </div>

        <div class="progress-track">

            <div
                id="englishXPBar"
                class="progress-fill"
            ></div>

        </div>

    </section>


    <!-- QUICK ACTIONS -->

    <section class="quick-actions">

        <button id="reviewButton">

            <span>↻</span>

            <div>
                <strong>Review</strong>
                <small>Practice your cards</small>
            </div>

        </button>


        <button id="createDeckButton">

            <span>＋</span>

            <div>
                <strong>New Deck</strong>
                <small>Create a collection</small>
            </div>

        </button>

    </section>


    <!-- DECKS -->

    <section class="decks-section">

        <div class="section-title">

            <div>
                <small>YOUR COLLECTIONS</small>
                <h2>Decks</h2>
            </div>

            <span id="deckCount">
                0
            </span>

        </div>


        <div
            id="deckList"
            class="deck-list"
        ></div>


        <div
            id="emptyDeck"
            class="empty-deck"
        >

            <div class="empty-icon">
                +
            </div>

            <strong>
                No decks yet
            </strong>

            <p>
                Create your first vocabulary collection.
            </p>

            <button id="emptyCreateButton">
                Create Deck
            </button>

        </div>

    </section>


</div>


<!-- DECK MODAL -->

<div
    id="deckModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <div>
                <small>ENGLISH WORLD</small>
                <h2>New Deck</h2>
            </div>

            <button id="closeDeckModal">
                ×
            </button>

        </div>


        <form id="deckForm">

            <label>
                Deck name
            </label>

            <input
                id="deckName"
                type="text"
                placeholder="e.g. Daily English"
                required
            >


            <label>
                Description
            </label>

            <input
                id="deckDescription"
                type="text"
                placeholder="e.g. Words I use every day"
            >


            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelDeck"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="create-button"
                >
                    Create Deck
                </button>

            </div>

        </form>

    </div>

</div>


<script src="english.js"></script>

</body>

</html>
